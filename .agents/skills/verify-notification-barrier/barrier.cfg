\* Handlers return promptly. The drain timeout never fires, so a clean
\* shutdown must drain on its own.
SPECIFICATION Spec
CONSTANTS
    MaxNotes = 3
    QueueCap = 2
    NoteKinds = {"plain"}
    AppCallers = {"app"}
    PeerCanClose = TRUE
    CtxCanCancel = TRUE
    DrainTimeoutFires = FALSE
INVARIANTS
    BarrierHolds
    InboundCtxOutlivesDrain
PROPERTIES
    ResponseReturnsCaller
    ShutdownCompletes
CHECK_DEADLOCK TRUE
