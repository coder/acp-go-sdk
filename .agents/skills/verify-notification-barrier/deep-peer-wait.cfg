\* The peer-wait release with $/cancel_request and an app caller. A
\* notification handler calls a request on the same connection, and the peer
\* answers it only after we answer the peer's own request. The handler of
\* that request calls a request with its ctx. The peer can cancel its request
\* or close, and an app goroutine calls SendRequest at any time. The peer
\* sends its request in the end (PeerSendsSpec). Run with check.sh --deep.
SPECIFICATION PeerSendsSpec
CONSTANTS
    MaxNotes = 1
    QueueCap = 2
    NoteKinds = {"nested"}
    AppCallers = {"a"}
    PeerCanClose = TRUE
    CtxCanCancel = FALSE
    DrainTimeoutFires = FALSE
    InReqs = {"in"}
    PeerCanCancelReq = TRUE
    PeerNeedsInboundAnswer = TRUE
    InReqCalls = TRUE
INVARIANTS
    BarrierHolds
    InboundCtxOutlivesDrain
    InboundHandlerAfterNotes
    NoWatermarkPanic
    CancelBeforeCheckSkipsHandler
PROPERTIES
    ResponseReturnsCaller
    CancelReturnsCaller
    DisconnectReturnsCaller
    InboundHandlerStarts
    InboundRequestAnswered
    ShutdownCompletes
CHECK_DEADLOCK TRUE
