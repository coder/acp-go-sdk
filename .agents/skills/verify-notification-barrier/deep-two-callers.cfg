\* Two app goroutines call SendRequest at once, as when a Prompt() and a
\* nested request from a Prompt handler overlap. Run with check.sh --deep.
\* TLC needs about 15 minutes.
SPECIFICATION Spec
CONSTANTS
    MaxNotes = 2
    QueueCap = 2
    NoteKinds = {"plain"}
    AppCallers = {"a1", "a2"}
    PeerCanClose = TRUE
    CtxCanCancel = TRUE
    DrainTimeoutFires = FALSE
INVARIANTS
    BarrierHolds
    InboundCtxOutlivesDrain
PROPERTIES
    ResponseReturnsCaller
    ShutdownCompletes
CHECK_DEADLOCK TRUE
