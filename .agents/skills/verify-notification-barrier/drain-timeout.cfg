\* A handler can run for any time, and the 5 s drain timeout fires in the
\* end. Shutdown must still finish.
SPECIFICATION TimerSpec
CONSTANTS
    MaxNotes = 2
    QueueCap = 2
    NoteKinds = {"plain", "slow"}
    AppCallers = {"app"}
    PeerCanClose = TRUE
    CtxCanCancel = TRUE
    DrainTimeoutFires = TRUE
    InReqs = {}
    PeerCanCancelReq = FALSE
    PeerNeedsInboundAnswer = FALSE
INVARIANTS
    BarrierHolds
    InboundCtxOutlivesDrain
PROPERTIES
    ShutdownCompletes
CHECK_DEADLOCK TRUE
