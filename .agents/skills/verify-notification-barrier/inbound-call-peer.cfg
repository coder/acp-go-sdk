\* A notification handler calls a request on the same connection, and the
\* peer answers it only after we answer the peer's own request. The handler
\* of that request calls a request with its ctx. The response to it must not
\* wait for the notification handler, or all three wait forever. The peer
\* answers both requests in the end when it can (NestedSpec).
SPECIFICATION NestedSpec
CONSTANTS
    MaxNotes = 1
    QueueCap = 2
    NoteKinds = {"nested"}
    AppCallers = {}
    PeerCanClose = TRUE
    CtxCanCancel = FALSE
    DrainTimeoutFires = FALSE
    InReqs = {"in"}
    PeerCanCancelReq = FALSE
    PeerNeedsInboundAnswer = TRUE
    InReqCalls = TRUE
INVARIANTS
    BarrierHolds
    InboundCtxOutlivesDrain
    InboundHandlerAfterNotes
    NoWatermarkPanic
PROPERTIES
    ResponseReturnsCaller
    InboundRequestAnswered
CHECK_DEADLOCK TRUE
