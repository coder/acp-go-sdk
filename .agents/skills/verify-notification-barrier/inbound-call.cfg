\* As inbound-nested, and the handler of the peer's request calls a request
\* with its ctx. That request waits for the handlers of the notifications
\* read before its response, unless the running handler waits on the peer.
\* The peer does not close: inbound-call-peer.cfg checks the disconnect, and
\* with it this config grows to about 500,000 states.
SPECIFICATION NestedSpec
CONSTANTS
    MaxNotes = 2
    QueueCap = 2
    NoteKinds = {"plain", "nested"}
    AppCallers = {}
    PeerCanClose = FALSE
    CtxCanCancel = FALSE
    DrainTimeoutFires = FALSE
    InReqs = {"in"}
    PeerCanCancelReq = FALSE
    PeerNeedsInboundAnswer = FALSE
    InReqCalls = TRUE
INVARIANTS
    BarrierHolds
    InboundCtxOutlivesDrain
    InboundHandlerAfterNotes
    NoWatermarkPanic
PROPERTIES
    ResponseReturnsCaller
    InboundRequestAnswered
CHECK_DEADLOCK TRUE
