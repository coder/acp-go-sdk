\* KNOWN FINDING. A notification handler calls a request on the same
\* connection, and the peer answers it only after we answer the peer's own
\* request. That request waits for the handler, so InboundRequestAnswered
\* fails. The peer answers the handler's request in the end when it can
\* (NestedSpec), so the failure is the cycle, not a silent peer.
SPECIFICATION NestedSpec
CONSTANTS
    MaxNotes = 1
    QueueCap = 2
    NoteKinds = {"nested"}
    AppCallers = {}
    PeerCanClose = TRUE
    CtxCanCancel = FALSE
    DrainTimeoutFires = FALSE
    InReqs = {"in"}
    PeerCanCancelReq = FALSE
    PeerNeedsInboundAnswer = TRUE
INVARIANTS
    BarrierHolds
    InboundCtxOutlivesDrain
    InboundHandlerAfterNotes
    NoWatermarkPanic
PROPERTIES
    InboundRequestAnswered
CHECK_DEADLOCK TRUE
