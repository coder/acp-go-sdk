\* A notification handler calls a request on the same connection, then
\* returns, while the peer sends its own request. That request may start
\* only while the handler waits on the peer, not once that wait has ended.
SPECIFICATION NestedSpec
CONSTANTS
    MaxNotes = 2
    QueueCap = 2
    NoteKinds = {"plain", "nested"}
    AppCallers = {}
    PeerCanClose = TRUE
    CtxCanCancel = FALSE
    DrainTimeoutFires = FALSE
    InReqs = {"in"}
    PeerCanCancelReq = FALSE
    PeerNeedsInboundAnswer = FALSE
INVARIANTS
    BarrierHolds
    InboundCtxOutlivesDrain
    InboundHandlerAfterNotes
    NoWatermarkPanic
PROPERTIES
    ResponseReturnsCaller
    InboundRequestAnswered
CHECK_DEADLOCK TRUE
