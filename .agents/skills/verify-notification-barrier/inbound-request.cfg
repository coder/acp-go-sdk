\* The peer sends notifications and one request, and can cancel the request
\* or close. Handlers return promptly.
SPECIFICATION Spec
CONSTANTS
    MaxNotes = 2
    QueueCap = 2
    NoteKinds = {"plain"}
    AppCallers = {}
    PeerCanClose = TRUE
    CtxCanCancel = FALSE
    DrainTimeoutFires = FALSE
    InReqs = {"in"}
    PeerCanCancelReq = TRUE
    PeerNeedsInboundAnswer = FALSE
INVARIANTS
    BarrierHolds
    InboundCtxOutlivesDrain
    InboundHandlerAfterNotes
    NoWatermarkPanic
PROPERTIES
    InboundHandlerStarts
    InboundRequestAnswered
    ShutdownCompletes
CHECK_DEADLOCK TRUE
