\* A notification handler can run for any time. $/cancel_request or a
\* disconnect must still free the inbound request that waits for it.
SPECIFICATION Spec
CONSTANTS
    MaxNotes = 2
    QueueCap = 2
    NoteKinds = {"plain", "slow"}
    AppCallers = {}
    PeerCanClose = TRUE
    CtxCanCancel = FALSE
    DrainTimeoutFires = FALSE
    InReqs = {"in"}
    PeerCanCancelReq = TRUE
    PeerNeedsInboundAnswer = FALSE
INVARIANTS
    BarrierHolds
    InboundCtxOutlivesDrain
    InboundHandlerAfterNotes
    NoWatermarkPanic
PROPERTIES
    CancelReturnsCaller
    DisconnectReturnsCaller
CHECK_DEADLOCK TRUE
