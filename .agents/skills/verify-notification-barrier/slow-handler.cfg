\* A handler can run for any time. A ctx cancel or a disconnect must still
\* free the caller that waits for it, without the drain timeout.
SPECIFICATION Spec
CONSTANTS
    MaxNotes = 2
    QueueCap = 2
    NoteKinds = {"plain", "slow"}
    AppCallers = {"app"}
    PeerCanClose = TRUE
    CtxCanCancel = TRUE
    DrainTimeoutFires = FALSE
INVARIANTS
    BarrierHolds
    InboundCtxOutlivesDrain
PROPERTIES
    CancelReturnsCaller
    DisconnectReturnsCaller
CHECK_DEADLOCK TRUE
