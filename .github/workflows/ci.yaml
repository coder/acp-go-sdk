name: CI

on:
  pull_request:
    paths-ignore:
      - "README.md"
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: check
    runs-on: ${{ github.repository_owner == 'coder' && 'depot-ubuntu-latest' || 'ubuntu-latest' }}
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: true
          cache: true

      - name: Check formatting (treefmt)
        run: mise exec -- make check

      - name: Make tests
        run: mise exec -- make test

      # The module zip that the Go proxy serves leaves out every folder with a
      # go.mod of its own; a test that reads one fails here.
      - name: Test the module zip
        run: mise exec -- make test-module-zip

      # int is 32 bits on 386, so a value that fits on amd64 can overflow.
      - name: Test as 32-bit code
        run: mise exec -- make test-386

  # Runs the ACP Test Compatibility Kit against the SDK's conformance agent
  # and fails when a result drifts from .agents/skills/verify-tck/baseline.json.
  tck:
    name: tck
    runs-on: ${{ github.repository_owner == 'coder' && 'depot-ubuntu-latest' || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: true
          cache: true

      - name: Run the TCK
        env:
          TCK_OUT: ${{ runner.temp }}/verify-tck
        run: mise exec -- make tck

      - name: Upload the TCK report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tck-report
          path: ${{ runner.temp }}/verify-tck/report.json
          if-no-files-found: warn
