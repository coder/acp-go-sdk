name: Schema update

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: update
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true

      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: true
          cache: true

      - name: Resolve the latest schema release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(gh release list --repo agentclientprotocol/agent-client-protocol \
            --limit 100 --exclude-pre-releases --json tagName \
            --jq '[.[] | .tagName | select(startswith("schema-v")) | ltrimstr("schema-v")] | first')
          current=$(cat schema/version)
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          if [ -n "${latest}" ] && [ "${latest}" != "${current}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate
        if: steps.latest.outputs.changed == 'true'
        run: |
          set -euo pipefail
          printf '%s\n' "${LATEST}" > schema/version
          mise exec -- make version
          mise exec -- make fmt
        env:
          LATEST: ${{ steps.latest.outputs.latest }}

      - name: Verify
        if: steps.latest.outputs.changed == 'true'
        run: mise exec -- make test

      - name: Open a pull request
        if: steps.latest.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.latest.outputs.latest }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          branch="schema/update-${LATEST}"
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            echo "Branch ${branch} already exists, nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git commit -am "chore(schema): bump ACP schema to ${LATEST}"
          git push origin "${branch}"
          gh pr create --base "${DEFAULT_BRANCH}" --head "${branch}" \
            --title "chore(schema): bump ACP schema to ${LATEST}" \
            --body "Automated regeneration against schema-v${LATEST}."
